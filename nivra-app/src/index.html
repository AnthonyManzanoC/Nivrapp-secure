<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Nivra - Private Messenger</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#05080b" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('nivra.theme');
        const light = theme === 'light' || (!theme && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.toggle('nivra-light-theme', light);
      } catch {}
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <script src="/native-config.js"></script>
  <app-root></app-root>
</body>

</html>
