<ion-content fullscreen class="page">
  <main class="invite-stage">
    <section class="invite-panel">
      <ion-icon name="lock-closed-outline"></ion-icon>
      @if (!error) {
        <h1>Abriendo Vault</h1>
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        <h1>Invitacion no disponible</h1>
        <p>{{ error }}</p>
        <ion-button mode="ios" (click)="goHome()">Continuar</ion-button>
      }
    </section>
  </main>
</ion-content>
