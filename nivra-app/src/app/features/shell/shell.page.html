<ion-app>
  <main class="workspace">
    <nav class="rail" aria-label="Nivra">
      <img class="rail-logo" src="assets/brand/nivra-mark.svg" alt="">
      @for (item of nav; track item.path) {
        <a class="nav-btn" [routerLink]="item.path" routerLinkActive="active">
          <ion-icon [name]="item.icon"></ion-icon>
          <span>{{ item.label }}</span>
        </a>
      }
      <span class="nav-spacer"></span>
      <button class="nav-btn logout" type="button" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Salir</span>
      </button>
    </nav>

    <section class="app-stage">
      <router-outlet></router-outlet>
    </section>

    @if (calls.activeCall(); as call) {
      <aside class="call-pill" [class.incoming]="calls.phase() === 'ringing'">
        <button class="call-pill-main" type="button" (click)="openCalls()">
          <ion-icon [name]="call.type === 'Video' ? 'videocam-outline' : 'call-outline'"></ion-icon>
          <span>
            <strong>{{ call.type === 'Video' ? 'Videollamada' : 'Llamada' }}</strong>
            <small>{{ calls.phase() }}</small>
          </span>
        </button>
        @if (calls.phase() === 'ringing') {
          <button class="pill-action accept" type="button" (click)="acceptCall()" aria-label="Aceptar llamada">
            <ion-icon name="call-outline"></ion-icon>
          </button>
          <button class="pill-action danger" type="button" (click)="declineCall()" aria-label="Rechazar llamada">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        } @else {
          <button class="pill-action danger" type="button" (click)="endCall()" aria-label="Colgar">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        }
      </aside>
    }
  </main>
</ion-app>
