name: Permissive Double Ratchet verification
on:
  push:
    branches: [codex/ratchet-permissive, codex/mobile-experience-8-2, main]
    paths: [crypto/ratchet-olm/**, crypto/ratchet-common/**, crypto/ratchet-wasm/web-device.mjs, Nivra.Api/**, checks/Nivra.RatchetChecks/**, nivra-app/src/**, nivra-app/angular.json, Nivra.Desktop/**, android/ratchet-lab/**, android/app/src/**, .github/workflows/ratchet-olm.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ratchet-olm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
      - run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
      - name: Check native security and build WASM
        working-directory: crypto/ratchet-olm
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
        run: |
          cargo metadata --locked --format-version 1 > dependency-metadata.json
          node check-dependencies.mjs dependency-metadata.json
          cargo test --locked
          cargo build --locked --release --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          wasm-bindgen --target nodejs --out-dir pkg/node target/wasm32-unknown-unknown/release/nivra_ratchet_olm.wasm
          wasm-bindgen --target web --out-dir pkg/web target/wasm32-unknown-unknown/release/nivra_ratchet_olm.wasm
      - run: npm ci --prefix crypto/ratchet-olm --ignore-scripts
      - run: node --test crypto/ratchet-olm/tests/*.test.mjs
      - run: node crypto/ratchet-olm/distribution.mjs assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ratchet-olm-portability
          path: |
            crypto/ratchet-olm/pkg/
            crypto/ratchet-olm/Cargo.lock
            crypto/ratchet-olm/dependency-metadata.json
            crypto/ratchet-olm/production/
          retention-days: 7

  client:
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
      - run: npm ci --prefix nivra-app --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ratchet-olm-portability
          path: crypto/ratchet-olm
      - name: Check application and encrypted history
        working-directory: nivra-app
        env:
          NG_BUILD_MAX_WORKERS: '2'
          NG_BUILD_PARALLEL_TS: 'false'
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.app.json --noEmit --pretty false
          node node_modules/@angular/cli/bin/ng.js test --watch=false --browsers=ChromeHeadlessNoGpu --progress=false
          npm run build

  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
      - run: npm ci --prefix nivra-app --ignore-scripts
      - run: node crypto/ratchet-olm/distribution.mjs verify
      - name: Check mobile and desktop design with synthetic contacts
        working-directory: nivra-app
        env:
          NG_BUILD_MAX_WORKERS: '2'
          NG_BUILD_PARALLEL_TS: 'false'
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node node_modules/@angular/cli/bin/ng.js build --configuration development,design-preview --output-path ../artifacts/design-preview --progress=false
          node ../tools/check-mobile-design.cjs ../artifacts/design-preview ../artifacts/design-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mobile-design-review
          path: artifacts/design-screenshots/
          if-no-files-found: warn
          retention-days: 7
  desktop:
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ratchet-olm-portability
          path: crypto/ratchet-olm
      - run: npm ci --prefix Nivra.Desktop
      - run: node --test Nivra.Desktop/*.test.js
      - if: runner.os == 'Linux'
        run: xvfb-run -a Nivra.Desktop/node_modules/.bin/electron --no-sandbox Nivra.Desktop/ratchet-assets.electron.cjs
      - if: runner.os == 'Windows'
        run: Nivra.Desktop/node_modules/.bin/electron.cmd Nivra.Desktop/ratchet-assets.electron.cjs
  postgres:
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: nivra_ratchet_tests
          POSTGRES_USER: ratchet_test
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIVRA_RATCHET_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=nivra_ratchet_tests;Username=ratchet_test;Password=isolated-ci-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.310
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ratchet-olm-portability
          path: crypto/ratchet-olm
      - run: dotnet build checks/Nivra.RatchetChecks/Nivra.RatchetChecks.csproj --nologo -v quiet
      - run: npm ci --prefix crypto/ratchet-olm --ignore-scripts
      - run: node crypto/ratchet-olm/server-interop.mjs
  android:
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ratchet-olm-portability
          path: crypto/ratchet-olm
      - name: Prepare isolated Android SDK and KVM
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ratchet-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name NivraRatchetCI --path "$ANDROID_AVD_HOME/NivraRatchetCI.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/NivraRatchetCI.avd" > "$ANDROID_AVD_HOME/NivraRatchetCI.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx NivraRatchetCI
      - name: Build separate laboratory APKs
        working-directory: android
        run: bash ./gradlew -PnivraRatchetLab=true -PnivraHybridLab=true :ratchet-lab:assembleDebug :ratchet-lab:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - name: Build native call UI in a separate application package
        run: |
          npm ci --ignore-scripts
          mkdir -p android/app/src/main/assets
          npx --no-install cap update android
          cd android
          bash ./gradlew -PnivraExperienceLab=true :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - name: Verify state across Android process restart
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          test -x "$adb"
          "$ANDROID_HOME/emulator/emulator" -avd NivraRatchetCI -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 -skin 480x800 > "$RUNNER_TEMP/ratchet-android-emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$adb" -s emulator-5554 logcat -d -s NivraRatchetLab:E AndroidRuntime:E > "$RUNNER_TEMP/ratchet-android-errors.log" || true; "$adb" -s emulator-5554 emu kill || true' EXIT
          booted=false
          for attempt in {1..150}; do
            kill -0 "$emulator_pid" 2>/dev/null || { tail -n 80 "$RUNNER_TEMP/ratchet-android-emulator.log"; exit 1; }
            if [[ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then booted=true; break; fi
            sleep 2
          done
          "$booted" || { tail -n 80 "$RUNNER_TEMP/ratchet-android-emulator.log"; exit 1; }
          "$adb" -s emulator-5554 shell wm dismiss-keyguard
          "$adb" -s emulator-5554 install -r android/ratchet-lab/build/outputs/apk/debug/ratchet-lab-debug.apk
          "$adb" -s emulator-5554 install -r android/ratchet-lab/build/outputs/apk/androidTest/debug/ratchet-lab-debug-androidTest.apk
          "$adb" -s emulator-5554 shell am instrument -w -e phase 1 com.nivra.ratchetlab.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/ratchet-android-phase1.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/ratchet-android-phase1.log"
          "$adb" -s emulator-5554 shell am force-stop com.nivra.ratchetlab
          "$adb" -s emulator-5554 shell am instrument -w -e phase 2 com.nivra.ratchetlab.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/ratchet-android-phase2.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/ratchet-android-phase2.log"
          "$adb" -s emulator-5554 shell dumpsys webviewupdate | grep 'Current WebView package' | tee "$RUNNER_TEMP/ratchet-android-webview.log"
          "$adb" -s emulator-5554 shell wm size 1080x2400
          "$adb" -s emulator-5554 shell wm density 420
          "$adb" -s emulator-5554 install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$adb" -s emulator-5554 install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$adb" -s emulator-5554 shell am instrument -w -e class com.nivra.app.IncomingCallExperienceInstrumentedTest com.nivra.app.experiencelab.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/ratchet-android-call-ui.log"
          grep -F 'OK (3 tests)' "$RUNNER_TEMP/ratchet-android-call-ui.log"
          "$adb" -s emulator-5554 pull /sdcard/Android/data/com.nivra.app.experiencelab/files/call-design/ "$RUNNER_TEMP/native-call-design/"
      - name: Preserve Android trial diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-android-trial
          path: |
            ${{ runner.temp }}/ratchet-android-*.log
            ${{ runner.temp }}/native-call-design/
          if-no-files-found: warn
          retention-days: 7
