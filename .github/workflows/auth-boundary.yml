name: Authentication boundary verification
on:
  push:
    branches: [main, 'codex/**']
    paths: [Nivra.Api/**, checks/Nivra.AuthBoundaryChecks/**, .github/workflows/auth-boundary.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.310
      - run: dotnet run --project checks/Nivra.AuthBoundaryChecks --verbosity quiet
