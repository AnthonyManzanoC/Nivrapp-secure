name: Ratchet PostgreSQL pilot
on:
  push:
    branches: [codex/ratchet-bridge]
    paths: [Nivra.Api/**, checks/Nivra.RatchetChecks/**, crypto/ratchet-pilot/**, crypto/ratchet-wasm/**, android/ratchet-lab/**, android/settings.gradle, .github/workflows/ratchet-server.yml, .github/workflows/ratchet-wasm.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ratchet-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wasm:
    uses: ./.github/workflows/ratchet-wasm.yml
  postgres:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: nivra_ratchet_tests
          POSTGRES_USER: ratchet_test
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIVRA_RATCHET_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=nivra_ratchet_tests;Username=ratchet_test;Password=isolated-ci-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.310
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ratchet-wasm-portability
          path: crypto/ratchet-wasm
      - run: dotnet build checks/Nivra.RatchetChecks/Nivra.RatchetChecks.csproj --nologo -v quiet
      - run: npm ci --prefix crypto/ratchet-pilot --ignore-scripts
      - run: node crypto/ratchet-pilot/server-interop.mjs
  android:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ratchet-wasm-portability
          path: crypto/ratchet-wasm
      - name: Prepare isolated Android SDK and KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name NivraRatchetCI --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
      - name: Build separate laboratory APKs
        working-directory: android
        run: bash ./gradlew -PnivraRatchetLab=true :ratchet-lab:assembleDebug :ratchet-lab:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - name: Verify state across Android process restart
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd NivraRatchetCI -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 -skin 480x800 > "$RUNNER_TEMP/ratchet-android-emulator.log" 2>&1 &
          trap 'adb -s emulator-5554 logcat -d -s NivraRatchetLab:E AndroidRuntime:E > "$RUNNER_TEMP/ratchet-android-errors.log" || true; adb -s emulator-5554 emu kill || true' EXIT
          booted=false
          for attempt in {1..150}; do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then booted=true; break; fi
            sleep 2
          done
          "$booted" || { tail -n 80 "$RUNNER_TEMP/ratchet-android-emulator.log"; exit 1; }
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 install -r android/ratchet-lab/build/outputs/apk/debug/ratchet-lab-debug.apk
          adb -s emulator-5554 install -r android/ratchet-lab/build/outputs/apk/androidTest/debug/ratchet-lab-debug-androidTest.apk
          adb -s emulator-5554 shell am instrument -w -e phase 1 com.nivra.ratchetlab.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/ratchet-android-phase1.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/ratchet-android-phase1.log"
          adb -s emulator-5554 shell am force-stop com.nivra.ratchetlab
          adb -s emulator-5554 shell am instrument -w -e phase 2 com.nivra.ratchetlab.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/ratchet-android-phase2.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/ratchet-android-phase2.log"
          adb -s emulator-5554 shell dumpsys webviewupdate | grep 'Current WebView package' | tee "$RUNNER_TEMP/ratchet-android-webview.log"
      - name: Preserve Android trial diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-android-trial
          path: ${{ runner.temp }}/ratchet-android-*.log
          if-no-files-found: warn
          retention-days: 7
