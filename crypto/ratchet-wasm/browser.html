<script type="module">
import init, * as bridge from './pkg/web/nivra_ratchet_wasm.js';

import { testBrowserStorage } from './browser-storage-tests.mjs';
import { testBrowserPersistence } from './browser-persistence-tests.mjs';

  await init();
  const fixture = await (await fetch('./fixtures.json')).json();
  if (!equal(bridge.identityPublic(bytes(fixture.identity)), bytes(fixture.public))) throw Error('Native identity mismatch');
  if (!bridge.verifyIdentity(bytes(fixture.public), bytes(fixture.context), bytes(fixture.signature))) throw Error('Native signature rejected');
  const keys = new Set();
  for (let i = 0; i < 16; i++) {
    const identity = bridge.createIdentity();
    const pub = bridge.identityPublic(identity);
    const signature = bridge.signIdentity(identity, bytes(fixture.context));
    if (!bridge.verifyIdentity(pub, bytes(fixture.context), signature)) throw Error('Browser signature failed');
    keys.add(Array.from(pub).join(',')); identity.fill(0);

  if (keys.size !== 16) throw Error('Browser randomness produced duplicate keys');
  const aliceKey = bridge.createIdentity(), bobKey = bridge.createIdentity();
  const alice = new bridge.RatchetDevice('browser-alice', 1, aliceKey, 41);
  const bob = new bridge.RatchetDevice('browser-bob', 1, bobKey, 42);
  await alice.pinIdentity('browser-bob', 1, bridge.identityPublic(bobKey));
  await bob.pinIdentity('browser-alice', 1, bridge.identityPublic(aliceKey));
  aliceKey.fill(0); bobKey.fill(0);

    await alice.establish('browser-bob', 1, await bob.preKeyBundle(Date.now()), Date.now());
    for (let i = 0; i < 6; i++) {
      const [sender, recipient, senderName, recipientName] = i % 2
        ? [bob, alice, 'browser-bob', 'browser-alice'] : [alice, bob, 'browser-alice', 'browser-bob'];
      const plain = new TextEncoder().encode('Browser turn ' + i);
      const packet = JSON.parse(await sender.encrypt(recipientName, 1, plain, Date.now()));
      if (!equal(await recipient.decrypt(senderName, 1, packet.type, bytes(packet.bytes)), plain)) throw Error('Browser ratchet mismatch');
    }
  } finally { alice.free(); bob.free(); }

    await webBob.pinIdentity(webAlice.address, webAlice.publicIdentity);
    await webAlice.establish(webBob.address, await webBob.bundle());

      const [sender, recipient] = i % 2 ? [webBob, webAlice] : [webAlice, webBob];
      const context = { conversationId: 'browser-chat', messageId: 'webcrypto-' + i };
      const payload = { text: 'WebCrypto turn ' + i };
