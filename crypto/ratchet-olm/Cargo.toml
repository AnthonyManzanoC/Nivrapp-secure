[package]
name = "nivra-ratchet-olm"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
description = "Nivra device bridge for the Apache-2.0 vodozemac Double Ratchet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { path = "vendor/vodozemac", default-features = false, features = ["precomputed-tables", "low-level-api"] }
ml-kem = { version = "=0.3.2", features = ["zeroize"] }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.130"
base64ct = { version = "1.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
