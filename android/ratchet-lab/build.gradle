apply plugin: 'com.android.application'

android {
    namespace 'com.nivra.ratchetlab'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.nivra.ratchetlab'
        minSdk 24
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1-laboratory'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/ratchet-assets')
}

dependencies {
    implementation "androidx.webkit:webkit:${rootProject.ext.androidxWebkitVersion}"
    implementation 'net.zetetic:sqlcipher-android:4.10.0@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

def hybridLab = providers.gradleProperty('nivraHybridLab').orNull == 'true'
def bridgeRoot = rootProject.file(hybridLab ? '../crypto/ratchet-olm' : '../crypto/ratchet-wasm')
def bridgeName = hybridLab ? 'nivra_ratchet_olm' : 'nivra_ratchet_wasm'
tasks.register('prepareRatchetAssets', Copy) {
    doFirst {
        if (!new File(bridgeRoot, "pkg/web/${bridgeName}_bg.wasm").isFile()) {
            throw new GradleException('Build/download the verified laboratory WASM artifact first')
        }
    }
    from(bridgeRoot) {
        include 'pkg/web/*.js', 'pkg/web/*.wasm'
    }
    from(rootProject.file('../crypto/ratchet-common')) { include 'web-device.mjs' }
    from('src/main/lab-web') {
        filter { line -> hybridLab ? line.replace('nivra_ratchet_wasm', 'nivra_ratchet_olm') : line }
    }
    into layout.buildDirectory.dir('generated/ratchet-assets')
}
tasks.named('preBuild').configure { dependsOn 'prepareRatchetAssets' }
